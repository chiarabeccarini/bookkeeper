name: Java CI - Bookkeeper Testing

on:
  push:
    branches: [ testing ]
  pull_request:
    branches: [ testing ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build and run tests with Maven
      run: mvn -B test -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

